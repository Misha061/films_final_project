{% extends 'base.html' %}

{% block title %}Видалити коментар{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="fas fa-exclamation-triangle"></i> Видалення коментаря</h5>
            </div>
            <div class="card-body p-4 text-center">
                <p class="text-muted">Ви впевнені, що хочете видалити цей коментар?</p>
                
                <div class="alert alert-light border p-3 mb-4 text-start">
                    <i class="fas fa-quote-left text-secondary me-2"></i>
                    <span class="fst-italic text-dark">{{ object.comment }}</span>
                </div>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'film_detail' object.film.pk %}" class="btn btn-light border">Скасувати</a>

                        <button type="submit" class="btn btn-danger fw-bold">Так, видалити</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
