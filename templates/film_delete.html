{% extends 'base.html' %}
{% block title %}Видалити фільм{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="fas fa-exclamation-triangle"></i> Підтвердження дії</h5>
            </div>
            <div class="card-body p-4 text-center">
                <p class="text-muted">Ви збираєтесь видалити фільм:</p>
                <h3 class="text-dark fw-bold mb-4">{{ object.title }}</h3>
                <p class="small text-danger mb-4">Цю дію неможливо скасувати.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'film_detail' object.pk %}" class="btn btn-light border">Ні, залишити</a>
                        <button type="submit" class="btn btn-danger fw-bold">Так, видалити</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
